name: Test Firebase Auth

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV

      - name: Test App Distribution API
        run: |
          pip install google-auth requests > /dev/null 2>&1
          python3 << 'PYEOF'
          import json, google.auth, google.auth.transport.requests

          credentials, project = google.auth.default(
              scopes=["https://www.googleapis.com/auth/cloud-platform"]
          )
          credentials.refresh(google.auth.transport.requests.Request())

          with open("/tmp/firebase-sa.json") as f:
              project_id = json.load(f)["project_id"]

          import requests as req
          # Firebase App Distribution API 호출
          url = f"https://firebaseappdistribution.googleapis.com/v1/projects/{project_id}/apps"
          r = req.get(url, headers={"Authorization": f"Bearer {credentials.token}"})
          print(f"App Distribution API: HTTP {r.status_code}")
          print(r.text[:500])
          PYEOF
