name: Test Firebase Auth

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV

      - name: Test App Distribution API
        run: |
          pip install google-auth requests > /dev/null 2>&1
          python3 << 'PYEOF'
          import json, google.auth, google.auth.transport.requests, requests as req

          credentials, project = google.auth.default(
              scopes=["https://www.googleapis.com/auth/cloud-platform"]
          )
          credentials.refresh(google.auth.transport.requests.Request())

          with open("/tmp/firebase-sa.json") as f:
              sa = json.load(f)
          project_id = sa["project_id"]
          print(f"Project: {project_id}")
          print(f"Service Account: {sa['client_email']}")

          headers = {"Authorization": f"Bearer {credentials.token}"}

          # 1. Firebase App Distribution API (v1)
          url1 = f"https://firebaseappdistribution.googleapis.com/v1/projects/{project_id}/apps"
          r1 = req.get(url1, headers=headers)
          print(f"\nv1 API: HTTP {r1.status_code}")
          if r1.status_code != 200:
              print(r1.json() if r1.headers.get('content-type','').startswith('application/json') else r1.text[:200])

          # 2. Firebase App Distribution API (v1alpha) - Gradle 플러그인이 사용할 수 있는 경로
          url2 = f"https://firebaseappdistribution.googleapis.com/v1alpha/apps/1:0:android:0/releases"
          r2 = req.get(url2, headers=headers)
          print(f"\nv1alpha API: HTTP {r2.status_code}")

          # 3. Firebase Management API - 앱 목록 조회
          url3 = f"https://firebase.googleapis.com/v1beta1/projects/{project_id}/androidApps"
          r3 = req.get(url3, headers=headers)
          print(f"\nFirebase Management API: HTTP {r3.status_code}")
          if r3.status_code == 200:
              apps = r3.json().get("apps", [])
              for app in apps:
                  print(f"  App: {app.get('displayName', 'N/A')} ({app.get('appId')})")
          else:
              print(r3.json() if r3.headers.get('content-type','').startswith('application/json') else r3.text[:200])
          PYEOF
