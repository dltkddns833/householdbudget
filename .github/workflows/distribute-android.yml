name: Android Firebase Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: '릴리즈 노트 (비워두면 기본값 사용)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Gradle 파일 및 RN 라이브러리의 하드코딩된 nvm 경로 대응 — 심링크 생성
      - name: Create nvm node symlink for Gradle
        run: |
          NODE_VERSION=$(node -v)
          mkdir -p "$HOME/.nvm/versions/node/${NODE_VERSION}/bin"
          ln -s "$(which node)" "$HOME/.nvm/versions/node/${NODE_VERSION}/bin/node"
          # settings.gradle/app/build.gradle에 하드코딩된 버전도 심링크
          mkdir -p "$HOME/.nvm/versions/node/v22.22.0/bin"
          ln -sf "$(which node)" "$HOME/.nvm/versions/node/v22.22.0/bin/node"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Setup Firebase credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      # 빌드만 수행 (Gradle 플러그인 업로드 제외)
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Firebase CLI로 업로드
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | head -1 | sed 's/[^0-9]//g')
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            NOTES="v${VERSION_NAME} (${VERSION_CODE})"
          fi
          firebase appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app 1:117803852591:android:bb036f53311d62ceb6b7da \
            --release-notes "$NOTES"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
